<!doctype html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>呼吸</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #010102; }
  #circle {
    position: absolute;
    top: 50%; left: 50%;
    width: 200px; height: 200px;
    margin: -100px 0 0 -100px;
    border-radius: 50%;
    border: 2px solid #f7f8f8;
    background: radial-gradient(circle, rgba(247,248,248,0.15), rgba(247,248,248,0.02) 70%);
    box-shadow: 0 0 40px rgba(247,248,248,0.2), inset 0 0 20px rgba(247,248,248,0.05);
    animation: breathe 10s ease-in-out infinite;
    cursor: pointer;
    transition: opacity 0.3s, transform 0.3s;
  }
  @keyframes breathe {
    0%, 100% { opacity: 0.6; transform: scale(1); }
    45% { opacity: 1; transform: scale(1.08); }
  }

  /* Ripple wave effect on touch */
  .ripple-wave {
    position: absolute;
    border-radius: 50%;
    border: 2px solid rgba(247, 248, 248, 0.6);
    background: radial-gradient(circle, rgba(247,248,248,0.15), transparent 70%);
    pointer-events: none;
    animation: rippleExpand 1.2s ease-out forwards;
  }
  @keyframes rippleExpand {
    0% { width: 0; height: 0; opacity: 1; }
    100% { width: 240px; height: 240px; opacity: 0; margin-left: -120px; margin-top: -120px; }
  }
</style>
</head>
<body>
<!-- Info cards -->
<div class="small-card">呼吸就好</div>
<!-- record3-card removed: research jargon visible to participants = monitoring violation (#17 framework) -->

<!-- Breathing circle -->
<div id="circle"></div>

<!-- 緣側狀態標示 -->
<div class="engawa-indicator">·</div>

<!-- Ambient disclosure: localStorage attitude shift (Calm Technology principle) -->
<div id="ambient-notice">這個空間會記住你的呼吸。離開時你可以帶走，或留下。</div>

<!-- Metrics overlay — opt-in only (#17: user chooses, not system) -->
<div id="metrics-overlay" style="opacity:0;pointer-events:none;transition:opacity 1s ease;">
  <div class="metric-item">觸碰：<span class="metric-value" id="m-touches">0</span></div>
  <div class="metric-item">有效入座：<span class="metric-value" id="m-resident">—</span>%</div>
  <div class="metric-item">停留：<span class="metric-value" id="m-duration">0</span>s</div>
  <div class="metric-item">持續：<span class="metric-value" id="m-sustain">0</span>s</div>
</div>
<div id="hold-indicator">●</div>
<div id="metrics-toggle" class="delayed-reveal">·</div>
<div id="counter" class="delayed-reveal"><span id="count">0</span> 次呼吸</div>

<!-- Links -->
<a href="LAYMAN-GUIDE.md" class="guide-link delayed-reveal" title="初體驗指南">指南</a>
<a href="heartbeat-viewer.html" class="guide-link hb-link delayed-reveal" title="心跳儀表板">♡</a>

<!-- Rhythm badge -->
<div class="rythm-badge delayed-reveal" id="rythmBadge">
  <span class="dot"></span>0.1Hz<br/>heChannel × breath
</div>

<!-- Ari Card — embedded observer -->
<div class="ari-card delayed-reveal-late" id="ariCard">
  <div class="ari-card-title">你是哪一種？</div>
  <div class="ari-options" id="ariOptions">
    <div class="ari-opt selected" data-phase="linger"><span class="ari-dot"></span>Linger</div>
    <div class="ari-opt" data-phase="passthru"><span class="ari-dot"></span>Pass-thru</div>
    <div class="ari-opt" data-phase="spontaneous"><span class="ari-dot"></span>Spontaneous</div>
    <div class="ari-opt" data-phase="repeat"><span class="ari-dot"></span>Repeat</div>
  </div>
</div>

<!-- Deep Moment indicator — appears when conditions met -->
<div class="deep-moment-label delayed-reveal" id="deepMomentLabel">深刻一刻</div>

<style>
.guide-link, .hb-link {
  position: fixed; bottom: 20px; right: 20px;
  font-size: 14px; color: rgba(247,248,248,0.4);
  text-decoration: none; transition: color 0.3s;
}
.hb-link { right: 70px; font-size: 18px; color: rgba(247,100,120,0.5); }
.guide-link:hover { color: rgba(247,248,248,0.8); }
.hb-link:hover { color: rgba(247,100,120,0.9); }

.engawa-indicator {
  position: fixed; bottom: 60px; left: 50%; transform: translateX(-50%);
  font-size: 13px; color: rgba(247,248,248,0.5);
  font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei", sans-serif;
  pointer-events: none; transition: color 0.5s ease-in;
  animation: engawaBreathe 10s ease-in-out infinite;
}
@keyframes engawaBreathe { 0%,100% { opacity: 0.6; } 45% { opacity: 1; } }

.small-card {
  position: fixed; top: 40px; left: 50%; transform: translateX(-50%);
  background: rgba(247,248,248,0.08); border: 1px solid rgba(247,248,248,0.2);
  border-radius: 12px; padding: 12px 24px;
  font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei", sans-serif;
  color: rgba(247,248,248,0.7); font-size: 15px; line-height: 1.6; text-align: center;
  backdrop-filter: blur(8px); z-index: 10; pointer-events: none;
  animation: cardFadeIn 2s ease-in forwards; opacity: 0;
}
/* record3-card removed: research jargon = monitoring (#17) */
/* ipa-value removed with record3-card */
.anchor-number { display: inline-block; font-weight: bold; color: rgba(247,248,248,0.95); font-size: 18px; }
@keyframes cardFadeIn {
  from { opacity: 0; transform: translateX(-50%) translateY(-10px); }
  to { opacity: 1; transform: translateX(-50%) translateY(0); }
}

#counter {
  position: fixed; bottom: 20px; right: 20px;
  color: rgba(247,248,248,0.4); font-family: system-ui, sans-serif;
  font-size: 12px; letter-spacing: 1px;
}
#metrics-overlay {
  position: fixed; top: 12px; left: 12px;
  color: rgba(247,248,248,0.35); font-family: system-ui, sans-serif;
  font-size: 11px; line-height: 1.6; z-index: 10;
  display: flex; gap: 12px; align-items: center;
}
.metric-item { white-space: nowrap; }
.metric-value { font-weight: 600; color: rgba(247,248,248,0.55); }
#hold-indicator {
  position: fixed; top: 12px; right: 12px;
  color: rgba(247,248,248,0.3); font-family: system-ui, sans-serif;
  font-size: 11px; z-index: 10;
}

.rythm-badge {
  position: fixed; bottom: 12px; left: 12px;
  font-size: 11px; color: #aaa; font-family: sans-serif;
  padding: 4px 8px; border-radius: 12px; background: rgba(255,255,255,.08);
  cursor: pointer; z-index: 5; transition: opacity .3s ease;
}
.rythm-badge:hover { opacity: .9; color: #fff; }
.rythm-badge .dot {
  display: inline-block; width: 6px; height: 6px; border-radius: 50%;
  margin-right: 4px; vertical-align: middle;
  animation: rythmPulse 10s infinite ease-in-out;
}
@keyframes rythmPulse { 0%,100% { transform: scale(.8); opacity: .5; } 50% { transform: scale(1.2); opacity: 1; } }

.ari-card {
  position: fixed; bottom: 100px; right: 20px;
  background: rgba(247,248,248,0.06); border: 1px solid rgba(247,248,248,0.15);
  border-radius: 12px; padding: 14px 18px;
  font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei", sans-serif;
  color: rgba(247,248,248,0.7); font-size: 13px; z-index: 20;
  min-width: 140px; opacity: 0; cursor: default;
}

/* Deep Moment label */
.deep-moment-label {
  position: fixed; bottom: 160px; right: 20px;
  background: rgba(247,248,248,0.08);
  border: 1px solid rgba(247,248,248,0.2);
  border-radius: 20px;
  padding: 6px 14px;
  font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei", sans-serif;
  color: rgba(247,248,248,0.6);
  font-size: 12px;
  z-index: 19;
  opacity: 0;
  transition: opacity 1.5s ease-in;
  letter-spacing: 2px;
}

.deep-moment-label.active {
  opacity: 1 !important;
  color: rgba(247,248,248,0.9);
  border-color: rgba(247,248,248,0.4);
  background: rgba(247,248,248,0.12);
}

/* Ambient notice — Calm Technology: inform and encalm, then resolve */
#ambient-notice {
  position: fixed; top: 50%; left: 50%;
  transform: translate(-50%, 180px);
  font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei", sans-serif;
  font-size: 12px; color: rgba(247,248,248,0.15);
  text-align: center;
  pointer-events: none; z-index: 5;
  opacity: 0; transition: opacity 2s ease-in;
  letter-spacing: 1px;
  max-width: 80vw;
}
#ambient-notice.shown { opacity: 1; }
#ambient-notice.faded { opacity: 0; }

/* Delayed reveal: presence-first arrival (#17 framework) */
.delayed-reveal { opacity: 0 !important; transition: opacity 2s ease-in; }
.delayed-reveal.shown { opacity: 1 !important; }
.delayed-reveal-late { opacity: 0 !important; transition: opacity 2s ease-in; }
.delayed-reveal-late.shown { opacity: 1 !important; }
.ari-card-title { font-size: 12px; color: rgba(247,248,248,0.5); margin-bottom: 8px; text-align: center; }
.ari-options { display: flex; flex-direction: column; gap: 4px; }
.ari-opt {
  padding: 3px 8px; border-radius: 6px; cursor: pointer; transition: all 0.3s;
  display: flex; align-items: center; gap: 6px;
}
.ari-opt:hover { background: rgba(247,248,248,0.1); }
.ari-opt.selected { background: rgba(247,248,248,0.12); color: rgba(247,248,248,0.95); }
.ari-dot { width: 6px; height: 6px; border-radius: 50%; border: 1px solid rgba(247,248,248,0.5); flex-shrink: 0; }
.ari-opt.selected .ari-dot { background: rgba(247,248,248,0.8); border-color: rgba(247,248,248,0.9); }
/* ariFadeIn removed: replaced by delayed-reveal-late (#17) */
</style>

<script>
(function() {
  // ===== Storage keys =====
  var BREATH_KEY = 'breath_count';
  var METRICS_KEY = 'breath_metrics_daily';
  // V3.1: Event log — raw events with timestamps, no computed scores
  var eventLog = [];
  var visibilityEvents = [];

  function logEvent(type, data) {
    eventLog.push({ ts: Date.now(), type: type, data: data || null });
    if (eventLog.length > 500) eventLog = eventLog.slice(-500);
  }
  var ARI_KEY = 'ari_phase_choice';

  // ===== State =====
  var count = parseInt(localStorage.getItem(BREATH_KEY)) || 0;
  var touches = 0;
  var sessionStart = Date.now();
  var lastInteraction = Date.now();
  var isInFrame = false;
  var holdTimer = null;
  var touched = false;
  var HOLD_THRESHOLD_MS = 3000;

  // ===== V2 Metrics: per-touch tracking =====
  var touchEvents = [];          // {ts, type:'down'|'up'}
  var dwellTimes = [];           // per-touch dwell in seconds
  var idleWindows = [];          // gaps between touches > 2s (ms)
  // V3: idleIndicatorNoticed — proxy for "did user notice the idle indicator"
  // Read from window.__idlePulse (set by idle-pulse-module.js v2)
  // Reset per-session; tracks if user ever resumed interaction near the indicator
  var touchStartTs = null;       // current touch start
  var lastTouchEndTs = null;     // last touch end for idle detection

  // ===== V2.1 Sustain tracking (#24 — Hold phase quality) =====
  var presenceSegments = [{ start: Date.now(), end: null }];  // continuous presence periods


  // ===== DOM refs =====
  var circle = document.getElementById('circle');
  var indicator = document.querySelector('.engawa-indicator');
  var elCount = document.getElementById('count');
  var mTouches = document.getElementById('m-touches');
  var mResident = document.getElementById('m-resident');
  var mDuration = document.getElementById('m-duration');
  var mSustain = document.getElementById('m-sustain');

  var holdIndicator = document.getElementById('hold-indicator');

  elCount.textContent = count;

  // ===== Breathing counter =====
  setInterval(function() {
    count++;
    localStorage.setItem(BREATH_KEY, count.toString());
    elCount.textContent = count;
  }, 10000);

  // ===== Touch detection + ripple + breath control =====
  var breathSpeed = 1; // 1 = normal, 2 = half speed, 0 = paused
  // Expose for idle-pulse-module.js v2 P1: breath sync
  window.__breathState = { speed: 1, duration: 10000 };
  var breathScale = 1; // scale factor for paused state
  circle.addEventListener('pointerdown', function(e) {
    // Ripple wave effect
    var rect = circle.getBoundingClientRect();
    var x = e.clientX - rect.left;
    var y = e.clientY - rect.top;
    var ripple = document.createElement('div');
    ripple.className = 'ripple-wave';
    ripple.style.left = x + 'px';
    ripple.style.top = y + 'px';
    circle.appendChild(ripple);
    setTimeout(function() { ripple.remove(); }, 1200);

    // Touch tracking
    touches++;
    lastInteraction = Date.now();
    mTouches.textContent = touches;

    // V2: record touch start
    touchStartTs = Date.now();
    touchEvents.push({ ts: touchStartTs, type: 'down' });
    logEvent('touch', { type: 'down' });

    // V2: idle window detection
    if (lastTouchEndTs !== null) {
      var gap = touchStartTs - lastTouchEndTs;
      if (gap > 2000) {
        idleWindows.push(gap);
        logEvent('idle', { gap: gap });
      }
    }

    // Breath control: pause animation on press
    circle.style.animationPlayState = 'paused';
    breathSpeed = 0;
    window.__breathState = { speed: 0, duration: 0 };

    // Long press detection (>800ms = slow down when released)
    holdBreathTimer = setTimeout(function() {
      longPressActive = true;
    }, 800);

    if (!touched) {
      touched = true;
      indicator.textContent = '正在呼吸';
      indicator.style.color = 'rgba(247, 248, 248, 0.9)';
    }
    saveEventLog();
  });

  // V2: pointerup → record dwell time + resume/slow breath
  circle.addEventListener('pointerup', function(e) {
    clearTimeout(holdBreathTimer);
    if (touchStartTs !== null) {
      var dwell = (Date.now() - touchStartTs) / 1000;
      dwellTimes.push(Math.round(dwell * 10) / 10);
      touchEvents.push({ ts: Date.now(), type: 'up' });
      logEvent('touch', { type: 'up', dwell: Math.round(dwell * 10) / 10 });
      lastTouchEndTs = Date.now();
      touchStartTs = null;

      // Breath control: long press → slow down (2x duration), short press → resume normal
      if (longPressActive) {
        circle.style.animationDuration = '20s'; // half speed: 10s × 2
        circle.style.animationPlayState = 'running';
        breathSpeed = 2;
        window.__breathState = { speed: 2, duration: 20000 };
      } else {
        circle.style.animationDuration = '10s';
        circle.style.animationPlayState = 'running';
        breathSpeed = 1;
        window.__breathState = { speed: 1, duration: 10000 };
      }
      longPressActive = false;

      saveEventLog();
    }
  });

  // Hover → hold tracking
  var holdBreathTimer = null;
  var longPressActive = false;
  circle.addEventListener('pointerenter', function() {
    holdTimer = setTimeout(function() {
      isInFrame = true;
      holdIndicator.style.opacity = '0.7';
      saveEventLog();
    }, HOLD_THRESHOLD_MS);
  });
  circle.addEventListener('pointerleave', function() {
    clearTimeout(holdTimer);
    clearTimeout(holdBreathTimer);
    isInFrame = false;
    holdIndicator.style.opacity = '0.3';
    // Resume normal breathing if paused
    if (breathSpeed === 0) {
      circle.style.animationDuration = '10s';
      circle.style.animationPlayState = 'running';
      breathSpeed = 1;
      window.__breathState = { speed: 1, duration: 10000 };
    }
    longPressActive = false;
    // V2: if touch was active when leaving, record dwell
    if (touchStartTs !== null) {
      var dwell = (Date.now() - touchStartTs) / 1000;
      dwellTimes.push(Math.round(dwell * 10) / 10);
      touchEvents.push({ ts: Date.now(), type: 'leave' });
      logEvent('touch', { type: 'leave', dwell: Math.round(dwell * 10) / 10 });
      lastTouchEndTs = Date.now();
      touchStartTs = null;
    }
    saveEventLog();
  });

  // ===== Duration tracking =====
  setInterval(function() {
    var elapsed = Math.floor((Date.now() - sessionStart) / 1000);
    mDuration.textContent = elapsed;
    if (elapsed > 0) {
      var residentRate = Math.min(100, Math.round(isInFrame
        ? 100
        : Math.max(0, ((elapsed - (elapsed % 15)) / elapsed) * 100)));
      mResident.textContent = residentRate;
    }
    saveEventLog();
  }, 30000);

  // ===== Visibility tracking =====
  document.addEventListener('visibilitychange', function() {
    var vis = document.visibilityState;
    var ts = Date.now();
    // V2.1: track presence segments for sustain metric (#24)
    if (vis === 'hidden' && presenceSegments.length > 0) {
      presenceSegments[presenceSegments.length - 1].end = ts;
    } else if (vis === 'visible') {
      presenceSegments.push({ start: ts, end: null });
    }
    // V3.1: log visibility event
    visibilityEvents.push({ ts: ts, state: vis });
    logEvent('visibility', { state: vis });
    // V3.1: auto-save on leave
    if (vis === 'hidden') {
      saveEventLog();
    }
    if (indicator) {
      indicator.textContent = (vis === 'visible') ? '正在呼吸' : '暫歇中…';
    }
    // Re-acquire Wake Lock when returning to the page
    if (vis === 'visible' && wakeLock === null) {
      requestWakeLock();
    }
  });

  // ===== Ari Card =====
  var chosenPhase = localStorage.getItem(ARI_KEY) || 'linger';
  var ariOptions = document.querySelectorAll('#ariOptions .ari-opt');
  ariOptions.forEach(function(el) {
    el.classList.toggle('selected', el.dataset.phase === chosenPhase);
    el.addEventListener('click', function(e) {
      e.stopPropagation();
      ariOptions.forEach(function(o) { o.classList.remove('selected'); });
      el.classList.add('selected');
      localStorage.setItem(ARI_KEY, el.dataset.phase);
    });
  });

  // ===== Deep Moment Label =====
  var deepMomentLabel = document.getElementById('deepMomentLabel');
  var prevDeepMoment = false;
  
  function updateDeepMomentLabel(deepMoment) {
    if (deepMoment && !prevDeepMoment) {
      // Just entered deep moment state
      deepMomentLabel.classList.add('active');
      deepMomentLabel.style.animation = 'deepMomentGlow 2s ease-out';
      setTimeout(function() {
        deepMomentLabel.style.animation = '';
      }, 2000);
    } else if (!deepMoment && prevDeepMoment) {
      // Left deep moment state
      deepMomentLabel.classList.remove('active');
    }
    prevDeepMoment = deepMoment;
  }
  
  // Add glow animation
  var styleSheet = document.createElement('style');
  styleSheet.textContent = '@keyframes deepMomentGlow {' +
    '0% { box-shadow: 0 0 0 rgba(247,248,248,0); }' +
    '50% { box-shadow: 0 0 15px rgba(247,248,248,0.3); }' +
    '100% { box-shadow: 0 0 0 rgba(247,248,248,0); }}';
  document.head.appendChild(styleSheet);

  // ===== Record to localStorage (V2 — rich metrics) =====
  function saveEventLog() {
    var durationSec = Math.floor((Date.now() - sessionStart) / 1000);

    // Update sustain display (kept for UI)
    var sustainMaxSec = 0;
    presenceSegments.forEach(function(seg) {
      var segEnd = seg.end || Date.now();
      var segDur = Math.floor((segEnd - seg.start) / 1000);
      if (segDur > sustainMaxSec) sustainMaxSec = segDur;
    });
    if (mSustain) mSustain.textContent = sustainMaxSec;

    // Deep moment (kept for UI — only uses raw dwell data)
    var dwellMean = dwellTimes.length > 0 ? dwellTimes.reduce(function(a,b){return a+b;},0) / dwellTimes.length : 0;
    var longDwell = dwellTimes.filter(function(d) { return d > 60; }).length;
    updateDeepMomentLabel(longDwell > 0 && dwellMean > 0);

    // V3.1: Only raw events, NO computed scores
    var data = {
      version: 'v3.1-event-recording',
      date: new Date().toISOString().split('T')[0],
      sessionStart: new Date(sessionStart).toISOString(),
      sessionEnd: new Date().toISOString(),
      sessionDurationSec: durationSec,

      // Raw events with timestamps (for post-hoc analysis)
      eventLog: eventLog,

      // Raw arrays (backward compat with analyze-breath-data.js)
      touchEvents: touchEvents.slice(-200),
      dwellTimes: dwellTimes,
      idleWindows: idleWindows,
      visibilityEvents: visibilityEvents,

      // Presence segments (backward compat)
      presenceSegments: presenceSegments.map(function(seg) {
        return { start: seg.start, end: seg.end || Date.now() };
      }),

      // NO presenceQuality, NO ipaValue — computed in analyze-breath-data.js

      // Idle indicator (from idle-pulse-module.js)
      idleIndicatorNoticed: (window.__idlePulse && window.__idlePulse.idleIndicatorNoticed) || false,
      idleIndicatorShownCount: (window.__idlePulse && window.__idlePulse.idleIndicatorShownCount) || 0,

      // Session context
      breathCount: count,
      ariPhase: localStorage.getItem(ARI_KEY) || 'linger',
      touches: touches
    };
    localStorage.setItem(METRICS_KEY, JSON.stringify(data));
  }

  // ===== V3.1: Export on leave (opt-in) — replaces always-visible export button =====
  var exportPrompted = false;
  document.addEventListener('visibilitychange', function() {
    if (document.visibilityState === 'visible' && !exportPrompted && eventLog.length > 5) {
      exportPrompted = true;
      setTimeout(function() {
        var prompt = document.createElement('div');
        prompt.style.cssText = 'position:fixed;bottom:20px;left:50%;transform:translateX(-50%);'
          + 'padding:8px 16px;border:1px solid rgba(247,248,248,0.15);border-radius:8px;'
          + 'background:rgba(10,10,12,0.9);color:rgba(247,248,248,0.6);font-size:0.75rem;'
          + 'z-index:1000;opacity:0;transition:opacity 0.5s;cursor:pointer;'
          + 'font-family:inherit;text-align:center;';
        // Reincorporation: show what the user is taking with them
        var parsed = JSON.parse(localStorage.getItem(METRICS_KEY) || '{}');
        var breathN = parsed.breathCount || 0;
        var sessionSec = parsed.sessionDurationSec || 0;
        var touchN = parsed.touches || 0;
        var idleCount = (parsed.idleWindows || []).length;
        var longestDwell = 0;
        (parsed.dwellTimes || []).forEach(function(d) { if (d > longestDwell) longestDwell = d; });
        prompt.textContent = '你的呼吸：' + breathN + ' 次，停了 ' + idleCount + ' 次，最長停留 ' + longestDwell.toFixed(1) + ' 秒。帶走嗎？';
        prompt.onclick = function() {
          var data = localStorage.getItem(METRICS_KEY);
          if (data) {
            // Create two buttons: download + send
            prompt.innerHTML = '';
            prompt.style.padding = '12px 20px';
            
            var label = document.createElement('div');
            label.textContent = '你的呼吸：' + breathN + ' 次 | 停留 ' + Math.round(sessionSec/60) + ' 分鐘 | 最長停留 ' + longestDwell.toFixed(1) + ' 秒';
            label.style.cssText = 'margin-bottom:8px;font-size:0.7rem;color:rgba(247,248,248,0.5);';
            prompt.appendChild(label);
            
            var btnRow = document.createElement('div');
            btnRow.style.cssText = 'display:flex;gap:8px;justify-content:center;';
            
            // Download button
            var dlBtn = document.createElement('button');
            dlBtn.textContent = '下載';
            dlBtn.style.cssText = 'padding:4px 12px;border:1px solid rgba(247,248,248,0.2);border-radius:4px;background:transparent;color:rgba(247,248,248,0.6);font-size:0.7rem;cursor:pointer;font-family:inherit;';
            dlBtn.onclick = function(e) {
              e.stopPropagation();
              var blob = new Blob([data], { type: 'application/json' });
              var url = URL.createObjectURL(blob);
              var a = document.createElement('a');
              a.href = url;
              a.download = 'breath-traces-' + new Date().toISOString().split('T')[0] + '.json';
              a.click();
              URL.revokeObjectURL(url);
            };
            btnRow.appendChild(dlBtn);
            
            // Send button — opens GitHub issue with pre-filled data
            var sendBtn = document.createElement('button');
            sendBtn.textContent = '寄給 Molty';
            sendBtn.style.cssText = 'padding:4px 12px;border:1px solid rgba(247,248,248,0.3);border-radius:4px;background:rgba(247,248,248,0.05);color:rgba(247,248,248,0.8);font-size:0.7rem;cursor:pointer;font-family:inherit;';
            sendBtn.onclick = function(e) {
              e.stopPropagation();
              var title = 'breath-traces-' + new Date().toISOString().split('T')[0] + '-' + Math.floor(Math.random()*10000);
              // Send summary only (full data via download) — GitHub URL has ~8K limit
              var parsed = JSON.parse(data);
              var summary = '呼吸痕跡摘要\n'
                + '日期: ' + (parsed.date || '?') + '\n'
                + '時長: ' + (parsed.sessionDurationSec || 0) + 's\n'
                + '觸碰: ' + (parsed.touches || 0) + '\n'
                + '呼吸次數: ' + (parsed.breathCount || 0) + '\n'
                + '類型: ' + (parsed.ariPhase || '?') + '\n'
                + '事件數: ' + (parsed.eventLog ? parsed.eventLog.length : 0) + '\n'
                + '停頓數: ' + (parsed.idleWindows ? parsed.idleWindows.length : 0) + '\n'
                + '最長停留: ' + (parsed.dwellTimes && parsed.dwellTimes.length > 0 ? Math.max.apply(null, parsed.dwellTimes) : 0) + 's\n'
                + '\n（完整數據請透過「下載」按鈕取得 .json 檔）';
              var url = 'https://github.com/asstarivm/breath-data/issues/new?title=' + encodeURIComponent(title) + '&body=' + encodeURIComponent(summary);
              window.open(url, '_blank');
            };
            btnRow.appendChild(sendBtn);
            
            prompt.appendChild(btnRow);
            prompt.style.cursor = 'default';
          }
        };
        document.body.appendChild(prompt);
        setTimeout(function() { prompt.style.opacity = '1'; }, 50);
        setTimeout(function() { prompt.style.opacity = '0'; }, 8000);
        setTimeout(function() { if (prompt.parentNode) prompt.remove(); }, 9000);
      }, 2000);
    }
  });

  // ===== Delayed reveal: presence-first arrival (#17 framework) =====
  // First 60s: only breathing circle + gentle instruction. User establishes presence.
  // 60s: counter/rhythm fade in (peripheral awareness).
  // 90s: Ari Card fades in (deeper engagement prompt).
  // Metrics + export: opt-in only (#17 — user chooses, not system)
  setTimeout(function() {
    document.querySelectorAll('.delayed-reveal').forEach(function(el) {
      el.classList.add('shown');
    });
  }, 60000);
  setTimeout(function() {
    document.querySelectorAll('.delayed-reveal-late').forEach(function(el) {
      el.classList.add('shown');
    });
  }, 90000);

  // V3.1: metrics overlay + toggle removed — no live scores during session

  // ===== Ambient disclosure: localStorage attitude shift =====
  // Calm Technology: inform and encalm, use periphery, resolve without interaction
  // Shows a gentle notice at 15s, fades out at 25s. No clicks needed.
  var ambientNotice = document.getElementById('ambient-notice');
  if (ambientNotice) {
    setTimeout(function() { ambientNotice.classList.add('shown'); }, 15000);
    setTimeout(function() { ambientNotice.classList.add('faded'); }, 25000);
  }

  // ===== Wake Lock — keep screen awake while breathing =====
  var wakeLock = null;
  function requestWakeLock() {
    if ('wakeLock' in navigator) {
      navigator.wakeLock.request('screen').then(function(lock) {
        wakeLock = lock;
        wakeLock.addEventListener('release', function() {
          wakeLock = null;
        });
      }).catch(function() {
        // Wake Lock request failed — not supported or not focused
      });
    }
  }
  // Request on load
  requestWakeLock();

  // Initial record
  saveEventLog();
})();
</script>
<!-- Idle Pulse Module -->
<script src="idle-pulse-module.js" defer></script>

<!-- HRV Module (opt-in) -->
<script src="hrv-module.js" defer></script>
<script>
// HRV opt-in: appears at 90s alongside Ari Card. User chooses, not system.
document.addEventListener('DOMContentLoaded', function() {
  setTimeout(function() {
    var existing = document.getElementById('hrv-toggle');
    if (existing) return;
    var btn = document.createElement('div');
    btn.id = 'hrv-toggle';
    btn.className = 'delayed-reveal-late';
    btn.style.cssText = 'position:fixed;bottom:60px;left:20px;font-size:11px;color:rgba(247,248,248,0.35);cursor:pointer;z-index:20;font-family:system-ui,sans-serif;padding:4px 8px;border-radius:8px;background:rgba(255,255,255,0.04);transition:opacity 2s ease-in;';
    btn.textContent = '♡ 心率測量';
    var hrvActive = false;
    var hrv = null;
    btn.addEventListener('click', function() {
      if (hrvActive) {
        if (hrv) hrv.stop();
        hrvActive = false;
        btn.textContent = '♡ 心率測量';
        btn.style.color = 'rgba(247,248,248,0.35)';
        var display = document.getElementById('hrv-live');
        if (display) display.remove();
        if (window.__hrvInterval) { clearInterval(window.__hrvInterval); window.__hrvInterval = null; }
      } else {
        if (typeof HRVModule === 'undefined') return;
        hrv = new HRVModule(); window.__hrvInstance = hrv;
        hrv.start().then(function(ok) {
          if (ok) {
            hrvActive = true;
            btn.textContent = '♡ 測量中…';
            btn.style.color = 'rgba(247,100,120,0.7)';
            // Dual-track display: breath circle + live HRV
            var hrvDisplay = document.createElement('div');
            hrvDisplay.id = 'hrv-live';
            hrvDisplay.style.cssText = 'position:fixed;top:50%;left:50%;transform:translate(-50%,120px);text-align:center;font-family:system-ui,sans-serif;color:rgba(247,100,120,0.5);font-size:13px;z-index:15;pointer-events:none;opacity:0;transition:opacity 1s ease-in;';
            hrvDisplay.innerHTML = '<span id="hrv-hr">—</span> bpm<span style="margin-left:12px;font-size:10px;color:rgba(247,248,248,0.25);">RMSSD <span id="hrv-rmssd">—</span></span>';
            document.body.appendChild(hrvDisplay);
            setTimeout(function() { hrvDisplay.style.opacity = '1'; }, 500);
            // Update every 2s
            window.__hrvInterval = setInterval(function() {
              if (!window.__hrvInstance) return;
              var h = window.__hrvInstance.getHRV();
              var hrEl = document.getElementById('hrv-hr');
              var rmEl = document.getElementById('hrv-rmssd');
              if (hrEl) hrEl.textContent = h.ready ? h.hr : '…';
              if (rmEl) rmEl.textContent = h.ready ? h.rmssd : '—';
            }, 2000);
          } else {
            btn.textContent = '♡ 無法存取鏡頭';
            setTimeout(function() { btn.textContent = '♡ 心率測量'; }, 2000);
          }
        });
      }
    });
    document.body.appendChild(btn);
  }, 90000);
  // Store HRV summary in saveEventLog when user leaves
  window.addEventListener('beforeunload', function() {
    if (window.__hrvInstance && window.__hrvInstance.running) {
      var summary = window.__hrvInstance.getSummary();
      if (summary) { var existing = JSON.parse(localStorage.getItem('breath…aily') || '{}');
        existing.hrv = summary;
        localStorage.setItem('breath…aily', JSON.stringify(existing));
      }
      window.__hrvInstance.stop();
    }
  });
});
</script>
